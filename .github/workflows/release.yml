name: Release

# Push a tag like v0.2.0 to build PortKit.zip and publish it as a GitHub release.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Test
        run: swift test
      - name: Build
        run: VERSION="${GITHUB_REF_NAME#v}" REPO="${{ github.repository }}" ./build.sh
      - name: Package
        run: ditto -c -k --sequesterRsrc --keepParent dist/PortKit.app PortKit.zip
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" PortKit.zip \
            --title "PortKit ${GITHUB_REF_NAME}" \
            --generate-notes
